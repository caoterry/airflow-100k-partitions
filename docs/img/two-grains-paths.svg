<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="One asset_event, three paths to a run"><style>
svg{--ink:#1c1b19;--quiet:#5f5d57;--edge:#a9a69b;--grid:#e6e3da;--muted:#b3b0a6;--ref:#8a877d;--accent:#2f6fd6;--bad:#cf3a3a}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ink{fill:var(--ink)} .quiet{fill:var(--quiet)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.box-accent{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.box-bad{fill:var(--bad);fill-opacity:.12;stroke:var(--bad);stroke-width:2}
.line-edge{stroke:var(--edge);stroke-width:1.25}
.line-grid{stroke:var(--grid);stroke-width:1}
.line-ref{stroke:var(--ref);stroke-width:1.25}
.line-muted{stroke:var(--muted);stroke-width:1.5}
.line-accent{stroke:var(--accent);stroke-width:1.5}
.fill-edge{fill:var(--edge)} .fill-muted{fill:var(--muted)} .fill-accent{fill:var(--accent)}
</style><rect width="100%" height="100%" rx="10" fill="#ffffff"/><defs><marker id="f1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fill-edge"/></marker></defs><text x="24" y="28" class="ink" font-size="15" font-weight="600">One asset_event, three paths to a run</text><g class="line-edge" fill="none"><path d="M224 168H248V88H270" marker-end="url(#f1-arrow)"/><path d="M224 168H270" marker-end="url(#f1-arrow)"/><path d="M224 168H248V248H270" marker-end="url(#f1-arrow)"/><path d="M482 88H518" marker-end="url(#f1-arrow)"/><path d="M482 168H518" marker-end="url(#f1-arrow)"/><path d="M482 248H518" marker-end="url(#f1-arrow)"/></g><rect x="24" y="140" width="200" height="56" rx="8" class="box"/><text x="124" y="164" class="ink" font-size="13" font-weight="600" text-anchor="middle">Producer task succeeds</text><text x="124" y="180" class="quiet" font-size="11.5" text-anchor="middle">api-server writes asset_event</text><text x="272" y="54" class="quiet" font-size="11.5">A · unkeyed event (balance sheet)</text><rect x="272" y="60" width="210" height="56" rx="8" class="box"/><text x="377" y="84" class="ink" font-size="13" font-weight="600" text-anchor="middle">asset_dag_run_queue row</text><text x="377" y="100" class="quiet" font-size="11.5" text-anchor="middle">one per consumer Dag</text><rect x="520" y="60" width="216" height="56" rx="8" class="box"/><text x="628" y="84" class="ink" font-size="13" font-weight="600" text-anchor="middle">Consumer DagRun</text><text x="628" y="100" class="quiet" font-size="11.5" text-anchor="middle">when the condition holds</text><text x="272" y="134" class="quiet" font-size="11.5">B · keyed event, partitioned consumer (native)</text><rect x="272" y="140" width="210" height="56" rx="8" class="box"/><text x="377" y="164" class="ink" font-size="13" font-weight="600" text-anchor="middle">APDR + PAKL rows</text><text x="377" y="180" class="quiet" font-size="11.5" text-anchor="middle">one per partition key</text><rect x="520" y="140" width="216" height="56" rx="8" class="box-bad"/><text x="628" y="164" class="ink" font-size="13" font-weight="600" text-anchor="middle">One DagRun per key</text><text x="628" y="180" class="quiet" font-size="11.5" text-anchor="middle">100,000 a day at account grain</text><text x="272" y="214" class="quiet" font-size="11.5">C · keyed event, no partitioned consumer (this design)</text><rect x="272" y="220" width="210" height="56" rx="8" class="box-accent"/><text x="377" y="244" class="ink" font-size="13" font-weight="600" text-anchor="middle">Nothing scheduled</text><text x="377" y="260" class="quiet" font-size="11.5" text-anchor="middle">no queue row, no APDR</text><rect x="520" y="220" width="216" height="56" rx="8" class="box-accent"/><text x="628" y="244" class="ink" font-size="13" font-weight="600" text-anchor="middle">Batcher Dag reads them</text><text x="628" y="260" class="quiet" font-size="11.5" text-anchor="middle">into the journal each tick</text></svg>
