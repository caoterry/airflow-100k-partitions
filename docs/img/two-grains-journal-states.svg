<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" viewBox="0 0 760 368" role="img" aria-label="An account is never claimed twice, and no version is lost"><style>
svg{--ink:#1c1b19;--quiet:#5f5d57;--edge:#a9a69b;--grid:#e6e3da;--muted:#b3b0a6;--ref:#8a877d;--accent:#2f6fd6;--bad:#cf3a3a}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ink{fill:var(--ink)} .quiet{fill:var(--quiet)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.box-accent{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.box-bad{fill:var(--bad);fill-opacity:.12;stroke:var(--bad);stroke-width:2}
.line-edge{stroke:var(--edge);stroke-width:1.25}
.line-grid{stroke:var(--grid);stroke-width:1}
.line-ref{stroke:var(--ref);stroke-width:1.25}
.line-muted{stroke:var(--muted);stroke-width:1.5}
.line-accent{stroke:var(--accent);stroke-width:1.5}
.fill-edge{fill:var(--edge)} .fill-muted{fill:var(--muted)} .fill-accent{fill:var(--accent)}
</style><rect width="100%" height="100%" rx="10" fill="#ffffff"/><defs><marker id="f3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fill-edge"/></marker><marker id="f3-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fill-accent"/></marker></defs><text x="24" y="28" class="ink" font-size="15" font-weight="600">An account is never claimed twice, and no version is lost</text><text x="24" y="48" class="quiet" font-size="11.5">journal.accounts.status as designed for production · blue: not in the prototype yet, see the list below</text><g class="line-edge" fill="none"><path d="M224 180H280" marker-end="url(#f3-arrow)"/><path d="M480 180H536" marker-end="url(#f3-arrow)"/><path d="M686 136V84H74V136" marker-end="url(#f3-arrow)"/><path d="M124 266V224" marker-end="url(#f3-arrow)"/></g><g class="line-accent" fill="none"><path d="M330 136V112H174V136" marker-end="url(#f3-arrow-blue)"/><path d="M380 224V272" marker-end="url(#f3-arrow-blue)"/></g><text x="252" y="172" class="quiet" font-size="11.5" text-anchor="middle">claim</text><text x="508" y="172" class="quiet" font-size="11.5" text-anchor="middle">publish</text><text x="82" y="76" class="quiet" font-size="11.5">claim reads a newer asset_event for a done account</text><text x="182" y="104" class="ink" font-size="11.5">publish, a newer version arrived in flight: re-open</text><text x="388" y="252" class="ink" font-size="11.5">spark task fails after retries</text><circle cx="124" cy="270" r="4" class="fill-edge"/><text x="124" y="292" class="quiet" font-size="11.5" text-anchor="middle">first event for an account</text><rect x="24" y="136" width="200" height="88" rx="8" class="box"/><text x="124" y="160" class="ink" font-size="13" font-weight="600" text-anchor="middle">pending</text><text x="124" y="176" class="quiet" font-size="11.5" text-anchor="middle">seen_version &gt; done_version</text><text x="124" y="192" class="quiet" font-size="11.5" text-anchor="middle">newer versions: same row</text><text x="124" y="208" class="quiet" font-size="11.5" text-anchor="middle">claimed in first_seen order</text><rect x="280" y="136" width="200" height="88" rx="8" class="box"/><text x="380" y="160" class="ink" font-size="13" font-weight="600" text-anchor="middle">inflight</text><text x="380" y="176" class="quiet" font-size="11.5" text-anchor="middle">claimed_version set at claim</text><text x="380" y="192" class="quiet" font-size="11.5" text-anchor="middle">batch = its batch id</text><text x="380" y="208" class="quiet" font-size="11.5" text-anchor="middle">never claimed twice</text><rect x="536" y="136" width="200" height="88" rx="8" class="box"/><text x="636" y="160" class="ink" font-size="13" font-weight="600" text-anchor="middle">done</text><text x="636" y="176" class="quiet" font-size="11.5" text-anchor="middle">done_version set from</text><text x="636" y="192" class="quiet" font-size="11.5" text-anchor="middle">claimed_version at publish</text><text x="636" y="208" class="quiet" font-size="11.5" text-anchor="middle">until a newer version lands</text><rect x="280" y="272" width="200" height="72" rx="8" class="box-accent"/><text x="380" y="296" class="ink" font-size="13" font-weight="600" text-anchor="middle">failed</text><text x="380" y="312" class="ink" font-size="11.5" text-anchor="middle">status and timestamp recorded</text><text x="380" y="328" class="ink" font-size="11.5" text-anchor="middle">only this batch is released</text></svg>
